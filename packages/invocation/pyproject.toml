[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockstat"
version = "3.1.0"
description = "StockStat V3.1 Invocation: StockStatClient + ComputeAPI + DSL + CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stockstat-foundation>=3.1.0",
    "stockstat-compute>=3.1.0",
    "httpx>=0.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "click>=8.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
viz = ["matplotlib>=3.5"]
all = ["stockstat[server,viz]"]

[project.scripts]
stockstat = "stockstat.app.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["stockstat*"]
